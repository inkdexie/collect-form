            <form id="joinForm" action="#" method="post">
                <!-- 基础信息区 -->
                <fieldset class="form-group">
                    <legend>基础信息</legend>

                    <!-- 1. text 文本输入 -->
                    <div class="form-item">
                        <label for="realname">真实姓名 <span class="required-mark">*</span></label>
                        <input type="text" id="realname" name="realname" placeholder="请输入你的真实姓名" required maxlength="20">
                        <p class="error-msg" id="err-realname"></p>
                    </div>

                    <div class="form-item">
                        <label for="studentid">学号 <span class="required-mark">*</span></label>
                        <input type="text" id="studentid" name="studentid" placeholder="10位数字学号" required pattern="\d{10}" title="学号必须为10位纯数字">
                        <p class="error-msg" id="err-studentid"></p>
                    </div>

                    <div class="form-item">
                        <label for="phone">手机号 <span class="required-mark">*</span></label>
                        <input type="text" id="phone" name="phone" placeholder="11位手机号码" required pattern="1[3-9]\d{9}" title="请输入正确的11位手机号码">
                        <p class="error-msg" id="err-phone"></p>
                    </div>

                    <!-- 2. email 邮箱输入 -->
                    <div class="form-item">
                        <label for="email">常用邮箱 <span class="required-mark">*</span></label>
                        <input type="email" id="email" name="email" placeholder="example@school.edu.cn" required>
                        <p class="error-msg" id="err-email"></p>
                    </div>

                    <!-- 3. password 密码输入 -->
                    <div class="form-item">
                        <label for="password">社团系统登录密码 <span class="required-mark">*</span></label>
                        <input type="password" id="password" name="password" placeholder="至少6位，需包含字母和数字" required pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$" title="密码至少6位，需同时包含字母和数字">
                        <p class="error-msg" id="err-password"></p>
                    </div>

                    <!-- 4. radio 单选按钮（label包裹） -->
                    <div class="form-item">
                        <label>性别 <span class="required-mark">*</span></label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="radio" name="gender" value="male" required> 男</label>
                            <label class="radio-label"><input type="radio" name="gender" value="female"> 女</label>
                            <label class="radio-label"><input type="radio" name="gender" value="other"> 其他</label>
                        </div>
                        <p class="error-msg" id="err-gender"></p>
                    </div>

                    <!-- 5. select 下拉选择 -->
                    <div class="form-item">
                        <label for="grade">年级 <span class="required-mark">*</span></label>
                        <select id="grade" name="grade" required>
                            <option value="">请选择你的年级</option>
                            <option value="freshman">大一</option>
                            <option value="sophomore">大二</option>
                            <option value="junior">大三</option>
                            <option value="senior">大四</option>
                            <option value="postgraduate">研究生</option>
                        </select>
                        <p class="error-msg" id="err-grade"></p>
                    </div>
                </fieldset>

                <!-- 兴趣意向区 -->
                <fieldset class="form-group">
                    <legend>兴趣意向</legend>

                    <!-- 6. checkbox 复选框（label包裹） -->
                    <div class="form-item">
                        <label>感兴趣的方向（可多选） <span class="required-mark">*</span></label>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="interest" value="cosplay"> Cosplay</label>
                            <label class="checkbox-label"><input type="checkbox" name="interest" value="manga"> 漫画创作</label>
                            <label class="checkbox-label"><input type="checkbox" name="interest" value="voiceactor"> 声优配音</label>
                            <label class="checkbox-label"><input type="checkbox" name="interest" value="game"> 游戏电竞</label>
                            <label class="checkbox-label"><input type="checkbox" name="interest" value="anime"> 动画研究</label>
                            <label class="checkbox-label"><input type="checkbox" name="interest" value="photography"> 动漫摄影</label>
                        </div>
                        <p class="error-msg" id="err-interest"></p>
                    </div>

                    <!-- 7. number 数字输入 -->
                    <div class="form-item">
                        <label for="joinyear">计划在社团待几年 <span class="required-mark">*</span></label>
                        <input type="number" id="joinyear" name="joinyear" min="1" max="4" value="1" required>
                        <p class="error-msg" id="err-joinyear"></p>
                    </div>

                    <!-- 8. date 日期选择 -->
                    <div class="form-item">
                        <label for="expectdate">期望第一次参加活动的日期</label>
                        <input type="date" id="expectdate" name="expectdate">
                    </div>

                    <!-- 9. textarea 文本域 -->
                    <div class="form-item">
                        <label for="selfintro">自我介绍（限100字）</label>
                        <textarea id="selfintro" name="selfintro" rows="4" placeholder="简单介绍一下你自己和你对动漫的热爱吧~" maxlength="100"></textarea>
                        <p class="char-count"><span id="charNum">0</span>/100</p>
                    </div>

                    <!-- 10. file 文件上传 -->
                    <div class="form-item">
                        <label for="avatar">上传一张你的动漫头像/同人作品</label>
                        <input type="file" id="avatar" name="avatar" accept="image/*">
                        <p class="hint">支持 JPG/PNG 格式，大小不超过5MB</p>
                    </div>
                </fieldset>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">提交报名</button>
                    <button type="reset" class="btn-reset">重置表单</button>
                </div>
            </form>
